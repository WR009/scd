# Build the Windows x64 release asset on a tag push and attach it to the GitHub Release.
#
#   git tag v0.2.1 && git push origin v0.2.1
#
# Only Windows x64 is built on purpose: it is the single platform the author installs and
# verifies by hand, and shipping binaries for platforms nobody tests is worse than not
# shipping them. The cross-platform build scripts stay in the repository (tools/dist.sh,
# install.sh) for anyone who wants to build for themselves - see README.en.md.
#
# `workflow_dispatch` lets you dry-run the packaging from the Actions tab without
# publishing anything.

name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    name: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Test
        id: test
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log

      # Job logs can only be downloaded by repository admins, so the interesting lines are
      # republished as check-run annotations: those show up in the Actions UI and are
      # readable through the public API.
      - name: Publish test failures
        if: steps.test.outcome == 'failure'
        shell: bash
        run: |
          grep -E 'panicked at|^---- |^failures:$|^ +[A-Za-z0-9_:]+$|test result: FAILED|^error' test.log |
            head -n 60 |
            while IFS= read -r line; do
              printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r')"
            done
          exit 1

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      # -ExecutionPolicy Bypass: the runner's policy is not ours to assume, and a blocked
      # script would be indistinguishable from a packaging bug.
      - name: Package
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/dist.ps1
          -Target x86_64-pc-windows-msvc
          -Label Windows_x64
          -Ext zip
          -SkipBuild

      - name: Smoke test the packaged binary
        shell: bash
        run: |
          bin="releases/Windows_x64/bin/scd.exe"
          "$bin" --version
          "$bin" --help | head -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: scd-x86_64-pc-windows-msvc
          path: |
            releases/*.zip
            releases/*.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            releases/*.zip
            releases/*.sha256